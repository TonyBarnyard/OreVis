[/Script/Engine.InputSettings]
bUseMouseForTouch=True
bEnableGestureRecognizer=True
bAlwaysShowTouchInterface=False
DefaultTouchInterface=None
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

; Fallback legacy bindings — Enhanced Input assets (IA_*, IMC_*) are the
; primary path and are created in-editor under /Game/Input/.
+AxisMappings=(AxisName="Touch1X",Key=Touch1,Scale=1.0)
+AxisMappings=(AxisName="Touch1Y",Key=Touch1,Scale=1.0)
+ActionMappings=(ActionName="TouchPress",Key=Touch1)
+ActionMappings=(ActionName="TouchPress2",Key=Touch2)
